<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zipstar</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #57534e;
      --stone: #e7e5e4;
      --paper: #f5f5f4;
      --slate: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: min(72vh, 720px);
      background:
        linear-gradient(180deg, rgba(245, 245, 244, 0.05) 40%, var(--paper) 100%),
        #e7e5e4 url("assets/zipstar-banner.jpg") center / cover no-repeat;
      display: flex;
      align-items: flex-end;
    }

    .hero-scrim {
      width: 100%;
      padding: 2.5rem 1.5rem 2rem;
      background: linear-gradient(180deg, transparent 0%, rgba(245, 245, 244, 0.92) 55%, var(--paper) 100%);
    }

    .hero-inner {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    /* Banner art already carries the wordmark; keep page chrome quiet below it. */
    .tagline {
      font-size: clamp(1.15rem, 2.4vw, 1.5rem);
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .prompt {
      margin-top: 1rem;
      display: inline-block;
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
      font-size: 0.9rem;
      color: var(--slate);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(28, 25, 23, 0.08);
      padding: 0.7rem 0.95rem;
    }

    .cta {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.25rem;
    }

    .cta a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-bottom: 2px solid var(--slate);
      padding-bottom: 0.12rem;
    }

    .cta a:hover { border-color: var(--ink); }

    main {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 0.5rem 1.5rem 3rem;
    }

    main p {
      max-width: 40rem;
      color: var(--muted);
      line-height: 1.55;
      font-size: 1.02rem;
    }

    footer {
      margin-top: auto;
      padding: 1rem 1.5rem 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a { color: var(--ink); }
  </style>
</head>
<body>
  <header class="hero" role="banner" aria-label="zipstar">
    <div class="hero-scrim">
      <div class="hero-inner">
        <p class="tagline">zip and beyond</p>
        <p class="prompt">$ zipstar a ./project</p>
        <nav class="cta" aria-label="Docs">
          <a href="../README.md">README</a>
          <a href="SPEC.md">SPEC</a>
          <a href="ARCHITECTURE.md">Architecture</a>
          <a href="IMPLEMENTATION_SPEC.md">Implementation</a>
        </nav>
      </div>
    </div>
  </header>
  <main>
    <p>
      Extensible archive / unarchive CLI. v1 ships zip (including AES-256 passwords) on macOS,
      with a format plugin seam for what comes next.
    </p>
  </main>
  <footer>
    <a href="https://github.com/fr13dman/zipstar">github.com/fr13dman/zipstar</a>
  </footer>
</body>
</html>
